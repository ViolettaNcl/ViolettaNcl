<svg xmlns="http://www.w3.org/2000/svg" width="108" height="38" viewBox="0 0 108 38">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="108" y2="38">
      <stop stop-color="#181825"/><stop offset="1" stop-color="#11111A"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="106" height="36" rx="18" fill="url(#g)" stroke="#3F3F46"/>
  <rect x="7" y="7" width="24" height="24" rx="12" fill="#6366F1" fill-opacity=".14"/>
  <circle cx="19" cy="19" r="3.5" fill="#6366F1" filter="url(#glow)">
    <animate attributeName="r" values="3.2;4.3;3.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="42" y="24" fill="#F5F3FF" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">Демо</text>
</svg>

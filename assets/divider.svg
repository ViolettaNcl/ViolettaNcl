    <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#2fd9ff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#ff5cc8" stop-opacity="0"/></linearGradient>

<svg width="1200" height="110" viewBox="0 0 1200 110" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Цифры">
  <title>Цифры</title>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">

<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Виолетта Николау — Full-Stack .NET разработчик</title>
  <desc id="desc">Premium dark-purple engineering header with animated data flow, grid, glow and system nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300">
      <stop stop-color="#07070C"/><stop offset=".52" stop-color="#11111A"/><stop offset="1" stop-color="#0C0917"/>
    </linearGradient>
    <linearGradient id="accent" x1="90" y1="0" x2="1110" y2="0">
      <stop stop-color="#6366F1"/><stop offset=".48" stop-color="#8B5CF6"/><stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow1">
      <stop stop-color="#8B5CF6" stop-opacity=".36"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2">
      <stop stop-color="#6366F1" stop-opacity=".22"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#C4B5FD" stroke-opacity=".052"/>
      <circle cx="0" cy="0" r="1.1" fill="#C4B5FD" fill-opacity=".08"/>
    </pattern>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="36"/></filter>
    <filter id="softGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect x="1" y="1" width="1198" height="298" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="38 38" dur="22s" repeatCount="indefinite"/>
    </rect>

    <ellipse cx="870" cy="58" rx="360" ry="185" fill="url(#glow1)" filter="url(#blur)">
      <animate attributeName="cx" values="780;930;780" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="45;82;45" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="320" cy="258" rx="250" ry="110" fill="url(#glow2)" filter="url(#blur)">
      <animate attributeName="cx" values="260;390;260" dur="15s" repeatCount="indefinite"/>
    </ellipse>

    <!-- animated architecture paths -->
    <g opacity=".38">
      <path d="M760 58H858C881 58 896 73 896 96V128" stroke="url(#accent)" stroke-width="1.4" stroke-dasharray="6 8">
        <animate attributeName="stroke-dashoffset" values="0;-56" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M836 174H956C981 174 996 159 996 136V112" stroke="#C4B5FD" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="5 9">
        <animate attributeName="stroke-dashoffset" values="0;56" dur="6s" repeatCount="indefinite"/>
      </path>
      <path d="M890 222H1060" stroke="#8B5CF6" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="4 8">
        <animate attributeName="stroke-dashoffset" values="0;-48" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- professional system nodes -->
    <g transform="translate(790 42)" filter="url(#softGlow)">
      <circle cx="0" cy="0" r="5" fill="#6366F1"><animate attributeName="r" values="4;6;4" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="106" cy="86" r="5" fill="#8B5CF6"><animate attributeName="opacity" values=".35;1;.35" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="206" cy="68" r="4" fill="#A855F7"><animate attributeName="r" values="3;5;3" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="270" cy="180" r="4" fill="#C4B5FD"><animate attributeName="opacity" values=".25;.9;.25" dur="3.4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- moving data particles -->
    <g filter="url(#softGlow)">
      <circle r="2.4" fill="#C4B5FD">
        <animateMotion dur="8.5s" repeatCount="indefinite" path="M760 58H858C881 58 896 73 896 96V128"/>
        <animate attributeName="opacity" values="0;1;.35;0" dur="8.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="2" fill="#A855F7">
        <animateMotion dur="7s" repeatCount="indefinite" path="M836 174H956C981 174 996 159 996 136V112"/>
      </circle>
      <circle r="2" fill="#8B5CF6">
        <animateMotion dur="5s" repeatCount="indefinite" path="M890 222H1060"/>
      </circle>
    </g>

    <!-- title block -->
    <rect x="78" y="54" width="4" height="124" rx="2" fill="url(#accent)"/>
    <rect x="96" y="54" width="94" height="2" rx="1" fill="url(#accent)" opacity=".9"/>
    <text x="104" y="108" fill="#F5F3FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="720" letter-spacing="4.6">ВИОЛЕТТА НИКОЛАУ</text>
    <text x="107" y="148" fill="#C4B5FD" font-family="JetBrains Mono,Consolas,monospace" font-size="19" font-weight="650" letter-spacing="2">FULL-STACK .NET РАЗРАБОТЧИК</text>
    <text x="107" y="183" fill="#A1A1AA" font-family="JetBrains Mono,Consolas,monospace" font-size="15" letter-spacing="1.15">ASP.NET CORE  /  BACKEND  /  REAL-TIME  /  APPLIED AI</text>

    <g transform="translate(104 226)">
      <rect width="316" height="32" rx="16" fill="#181825" stroke="#30303A"/>
      <circle cx="18" cy="16" r="4" fill="#8B5CF6" filter="url(#softGlow)">
        <animate attributeName="opacity" values=".35;1;.35" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="21" fill="#B8B8C7" font-family="JetBrains Mono,Consolas,monospace" font-size="12.5" letter-spacing=".65">C#  ·  API  ·  DATA  ·  DELIVERY</text>
    </g>

    <!-- mini terminal / system diagram -->
    <g transform="translate(980 48)">
      <rect width="142" height="170" rx="19" fill="#0F0F18" stroke="#30303A"/>
      <circle cx="20" cy="20" r="3" fill="#6366F1"/>
      <circle cx="31" cy="20" r="3" fill="#8B5CF6"/>
      <circle cx="42" cy="20" r="3" fill="#A855F7"/>
      <path d="M20 54H101M20 73H82M20 92H112M20 111H72M20 130H96" stroke="#C4B5FD" stroke-opacity=".28" stroke-width="2" stroke-linecap="round"/>
      <rect x="20" y="145" width="14" height="3" rx="1.5" fill="#8B5CF6">
        <animate attributeName="width" values="14;88;14" dur="4.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="70" y="280" width="1060" height="2" rx="1" fill="url(#accent)" opacity=".48">
      <animate attributeName="opacity" values=".2;.72;.2" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="28" stroke="#2B2B35" stroke-width="2"/>
</svg>
